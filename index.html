<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ส่งคำมุทิตา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --ink:      #16302c;
    --paper:    #faf3e2;
    --paper-2:  #f2e8cf;
    --night:    #0e2e30;
    --night-2:  #143f3f;
    --flame:    #f0a83c;
    --flame-2:  #e2632f;
    --ribbon:   #c14a5c;
    --muted:    #7a6a4c;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    background: radial-gradient(120% 90% at 50% 18%, var(--night-2) 0%, var(--night) 62%, #081c1d 100%);
    font-family:'Mitr', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  body{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px 56px;
  }

  /* soft candle glow drifting behind the card */
  .glow{
    position:fixed;
    top:8%;
    left:50%;
    width:340px;
    height:340px;
    transform:translateX(-50%);
    background: radial-gradient(circle, rgba(240,168,60,0.35) 0%, rgba(240,168,60,0) 70%);
    filter: blur(4px);
    pointer-events:none;
    animation: drift 7s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ opacity:.75; transform:translateX(-50%) translateY(0); }
    50%{ opacity:1; transform:translateX(-48%) translateY(10px); }
  }

  .stage{
    position:relative;
    width:100%;
    max-width:380px;
  }

  /* ---------- candle ---------- */
  .candle{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    margin-bottom:-18px;
    z-index:2;
  }
  .candle svg{ width:56px; height:auto; }
  .flame{
    transform-origin: 50% 100%;
    animation: flicker 2.6s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{ transform: scaleY(1) scaleX(1) rotate(0deg); }
    30%{ transform: scaleY(1.08) scaleX(0.94) rotate(-2deg); }
    55%{ transform: scaleY(0.94) scaleX(1.05) rotate(2deg); }
    80%{ transform: scaleY(1.05) scaleX(0.97) rotate(-1deg); }
  }

  /* ---------- card ---------- */
  .card{
    position:relative;
    background: var(--paper);
    border-radius: 6px 6px 46px 6px;
    padding: 46px 30px 34px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.55),
      0 2px 0 rgba(255,255,255,0.4) inset;
    text-align:center;
    z-index:1;
    opacity:0;
    transform: translateY(14px);
    animation: rise .7s .15s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }

  /* folded-corner detail, ties to the card's cut corner */
  .card::after{
    content:"";
    position:absolute;
    right:0;
    bottom:0;
    width:46px;
    height:46px;
    background: linear-gradient(135deg, transparent 50%, var(--paper-2) 50%);
    border-radius: 0 0 46px 0;
  }

  .eyebrow-line{
    width:34px;
    height:2px;
    background:var(--flame-2);
    margin: 0 auto 16px;
    border-radius:2px;
  }

  .kicker{
    font-size:14px;
    letter-spacing:.02em;
    color:var(--muted);
    margin:0 0 6px;
  }

  #cardName, #listCount{
    font-family:'Chonburi', serif;
    font-size: clamp(28px, 8vw, 36px);
    line-height:1.25;
    margin: 0 0 18px;
    color: var(--ribbon);
    word-break: break-word;
  }

  #cardMsg, #listMsg{
    font-size:16px;
    line-height:1.8;
    color:var(--ink);
    margin: 0 0 30px;
    padding: 0 4px;
  }

  /* ---------- multi-person list mode ---------- */
  .list-wrap{
    position:relative;
    margin: 0 0 22px;
  }

  .name-list{
    max-height: 236px;
    overflow-y: auto;
    text-align:left;
    padding: 2px 8px 2px 2px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--paper-2) transparent;
  }
  .name-list::-webkit-scrollbar{ width:5px; }
  .name-list::-webkit-scrollbar-thumb{ background: var(--paper-2); border-radius:4px; }

  .name-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding: 9px 2px;
    border-bottom: 1px dashed rgba(22,48,44,0.14);
    font-size:15px;
    line-height:1.4;
  }
  .name-row:last-child{ border-bottom:none; }
  .name-row .dot{ flex:0 0 auto; font-size:13px; }
  .name-row .n{ flex:1 1 auto; min-width:0; word-break:break-word; color:var(--ink); }

  /* บอกใบ้ว่ายังเลื่อนดูต่อได้ — โชว์เฉพาะตอนรายชื่อยาวเกินกล่อง (toggled by JS) */
  .list-wrap::after{
    content:"";
    position:absolute;
    left:0; right:6px; bottom:0;
    height:0;
    background: linear-gradient(to bottom, rgba(250,243,226,0) 0%, var(--paper) 85%);
    pointer-events:none;
    transition: height .2s ease;
  }
  .list-wrap.has-more::after{ height:28px; }

  #shareBtn{
    appearance:none;
    border:none;
    cursor:pointer;
    background: var(--ribbon);
    color:#fff8ee;
    font-family:'Mitr', sans-serif;
    font-weight:500;
    font-size:16px;
    padding: 14px 30px;
    border-radius: 999px;
    box-shadow: 0 10px 22px -8px rgba(193,74,92,0.65);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #shareBtn:active{
    transform: translateY(1px) scale(.98);
    box-shadow: 0 6px 14px -6px rgba(193,74,92,0.6);
  }

  .hint{
    margin-top:16px;
    font-size:12.5px;
    color:#c9c2ad;
  }

  /* confetti burst on share */
  .confetti{
    position:fixed;
    top:0; left:0;
    width:0; height:0;
    pointer-events:none;
  }
  .confetti span{
    position:absolute;
    width:7px; height:11px;
    opacity:0;
    border-radius:1px;
  }

  @media (max-width:340px){
    .card{ padding: 40px 20px 28px; }
    .name-list{ max-height:200px; }
  }
</style>
</head>
<body>

  <div class="glow"></div>

  <div class="stage">
    <div class="candle" aria-hidden="true">
      <svg viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg">
        <rect x="14" y="26" width="12" height="40" rx="2" fill="#f6e7c9"/>
        <rect x="14" y="26" width="12" height="6" fill="#e8a33d" opacity="0.5"/>
        <line x1="20" y1="18" x2="20" y2="26" stroke="#5a4326" stroke-width="1.5"/>
        <g class="flame">
          <path d="M20 0 C27 9 25 16 20 19 C15 16 13 9 20 0 Z" fill="#f0a83c"/>
          <path d="M20 6 C24 11 23 15 20 17 C17 15 16 11 20 6 Z" fill="#fdd98a"/>
        </g>
      </svg>
    </div>

    <div class="card">
      <div class="eyebrow-line"></div>

      <!-- โหมดคนเดียว — เปิดจากปุ่ม "เปิดการ์ด" ของแต่ละคน -->
      <div id="singleView">
        <p class="kicker">การ์ดอวยพรวันเกิด</p>
        <h1 id="cardName">ท่าน</h1>
        <p id="cardMsg">กำลังเตรียมคำอวยพร…</p>
      </div>

      <!-- โหมดรายชื่อรวม — เปิดจากปุ่ม "ดูรายชื่อทั้งหมด" ในการ์ดสรุป -->
      <div id="listView" style="display:none;">
        <p class="kicker">วันนี้มีวันเกิด</p>
        <h1 id="listCount">0 ท่าน</h1>
        <div class="list-wrap" id="listWrap">
          <div class="name-list" id="nameList"></div>
        </div>
        <p id="listMsg">ขอให้ทุกท่านมีความสุขมาก ๆ ในวันพิเศษนี้นะครับ 🎉🎂</p>
      </div>

      <button id="shareBtn" type="button">💌 แชร์การ์ดนี้</button>
      <p class="hint">กดปุ่มด้านบนเพื่อส่งคำอวยพรต่อในแชท</p>
    </div>
  </div>

<script>
  const LIFF_ID = '2011371216-mdsClEqy';

  /* ── อ่านค่าจาก URL — วางระดับบนสุด ไม่ต้องรอ liff.init() ── */
  const params     = new URLSearchParams(location.search);
  const namesParam = params.get('names');           // โหมดรายชื่อรวม
  const isListMode = !!namesParam;

  const nickName = params.get('name') || 'ท่าน';    // โหมดคนเดียว
  const fullName = params.get('full') || nickName;

  // URLSearchParams.get() คืนค่าที่ decode ให้แล้วโดยอัตโนมัติ ไม่ต้อง decodeURIComponent ซ้ำ
  const nameList = isListMode
    ? namesParam.split('|').map(function (s) { return s.trim(); }).filter(Boolean)
    : [];

  const wishFor = (name) =>
    `ขอให้คุณ${name} มีความสุขมาก ๆ ในวันพิเศษนี้นะครับ สุขภาพแข็งแรง ` +
    `สมหวังในทุกเรื่องที่ตั้งใจ 🎂🎉`;

  function renderSingle() {
    document.getElementById('cardName').textContent = fullName;
    document.getElementById('cardMsg').textContent  = wishFor(nickName);
  }

  function renderList() {
    document.getElementById('singleView').style.display = 'none';
    document.getElementById('listView').style.display   = 'block';
    document.getElementById('listCount').textContent = nameList.length + ' ท่าน';

    const box = document.getElementById('nameList');
    box.innerHTML = '';
    nameList.forEach(function (n) {
      const row = document.createElement('div');
      row.className = 'name-row';

      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.textContent = '🎈';

      const label = document.createElement('span');
      label.className = 'n';
      label.textContent = n;

      row.appendChild(dot);
      row.appendChild(label);
      box.appendChild(row);
    });

    // โชว์ fade บอกใบ้ให้เลื่อนดูต่อ เฉพาะตอนรายชื่อยาวเกินกล่อง — ไม่ให้การ์ดล้น
    requestAnimationFrame(function () {
      const wrap = document.getElementById('listWrap');
      if (box.scrollHeight > box.clientHeight + 4) wrap.classList.add('has-more');
    });
  }

  // แสดงข้อความได้ทันทีจาก query string โดยไม่ต้องรอ LIFF
  if (isListMode) { renderList(); } else { renderSingle(); }

  async function main() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      // เข้าสู่ระบบแล้ว — เนื้อหาแสดงอยู่แล้วจากขั้นตอนด้านบน
    } catch (e) {
      console.error('LIFF init error:', e);
      // ปล่อยให้การ์ดที่ render ไว้แล้วแสดงต่อไป แม้ LIFF จะ init ไม่สำเร็จ
      // (เช่น เปิดจากเบราว์เซอร์ปกตินอกแอป LINE)
    }
  }

  function burstConfetti() {
    const colors = ['#e8a33d', '#c14a5c', '#3e7a6f', '#f2e8cf'];
    const wrap = document.createElement('div');
    wrap.className = 'confetti';
    document.body.appendChild(wrap);

    const originX = window.innerWidth / 2;
    const originY = window.innerHeight * 0.55;

    for (let i = 0; i < 26; i++) {
      const el = document.createElement('span');
      const angle = Math.random() * Math.PI * 2;
      const dist  = 60 + Math.random() * 140;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 40;
      el.style.left = originX + 'px';
      el.style.top  = originY + 'px';
      el.style.background = colors[i % colors.length];
      el.style.transform = `rotate(${Math.random()*360}deg)`;
      el.style.transition = `transform ${700 + Math.random()*400}ms ease-out, opacity 900ms ease-out`;
      wrap.appendChild(el);

      requestAnimationFrame(() => {
        el.style.opacity = '1';
        el.style.transform = `translate(${dx}px, ${dy}px) rotate(${Math.random()*540}deg)`;
      });
      setTimeout(() => { el.style.opacity = '0'; }, 550);
    }
    setTimeout(() => wrap.remove(), 1500);
  }

  document.getElementById('shareBtn').addEventListener('click', async () => {
    burstConfetti();

    if (typeof liff === 'undefined' || !liff.isInClient || !liff.isInClient()) {
      alert('กรุณาเปิดลิงก์นี้ผ่านแอป LINE เพื่อใช้ปุ่มแชร์');
      return;
    }
    if (!liff.isApiAvailable('shareTargetPicker')) {
      alert('อุปกรณ์นี้ยังไม่รองรับการแชร์การ์ดนี้');
      return;
    }

    try {
      await liff.shareTargetPicker([{
        type: 'flex',
        altText: isListMode
          ? ('🎉 วันนี้มีวันเกิด ' + nameList.length + ' ท่าน')
          : ('สุขสันต์วันเกิด ' + nickName + '!'),
        contents: buildShareFlexContents()
      }]);
    } catch (e) {
      console.error('shareTargetPicker error:', e);
    }
  });

  // การ์ด Flex เดียวกับที่ Apps Script ส่งเข้ามา — ใช้ตอนกด "แชร์การ์ดนี้"
  // รวมทุกชื่อไว้ในบับเบิลเดียว ไม่ว่าจะเปิดจากโหมดคนเดียวหรือโหมดรายชื่อรวม
  function buildShareFlexContents() {
    const namesToShow = isListMode ? nameList : [fullName];
    const MAX_SHOWN = 10;
    const shown = namesToShow.slice(0, MAX_SHOWN);
    const remaining = namesToShow.length - shown.length;

    const nameRows = shown.map(function (n) {
      return {
        type: 'box',
        layout: 'baseline',
        spacing: 'sm',
        contents: [
          { type: 'text', text: '🎂', flex: 0, size: 'sm' },
          { type: 'text', text: n, size: 'sm', wrap: true, flex: 1 }
        ]
      };
    });
    if (remaining > 0) {
      nameRows.push({ type: 'text', text: 'และอีก ' + remaining + ' ท่าน', size: 'xs', color: '#8c8c8c', margin: 'md' });
    }

    const titleLine = namesToShow.length > 1
      ? 'วันนี้มีวันเกิด ' + namesToShow.length + ' ท่าน'
      : 'แด่ ' + namesToShow[0];

    return {
      type: 'bubble',
      hero: {
        type: 'image',
        url: 'https://i3alldotcom.github.io/monk24-birthday/hbd24.png',
        size: 'full',
        aspectRatio: '940:788',
        aspectMode: 'cover'
      },
      body: {
        type: 'box',
        layout: 'vertical',
        spacing: 'md',
        contents: [
          { type: 'text', text: 'มุทิตาจิตเนื่องในวันเกิด!', weight: 'bold', size: 'xl', color: '#FF6B6B', align: 'center' },
          { type: 'text', text: titleLine, size: 'md', align: 'center', margin: 'md', weight: 'bold' },
          { type: 'separator', margin: 'lg' },
          { type: 'box', layout: 'vertical', margin: 'lg', spacing: 'sm', contents: nameRows },
          { type: 'separator', margin: 'lg' },
          { type: 'text', text: 'ขอให้มีความสุข สมหวัง แข็งแรง เข้าถึงธรรมนะครับ 🎂🎉', wrap: true, margin: 'lg', size: 'sm', align: 'center' }
        ]
      }
    };
  }

  main();
</script>

</body>
</html>
