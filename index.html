<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>การ์ดอวยพรวันเกิด</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --pink:#FF6B9D; --deep:#C9184A; --soft:#FFF0F5;
  --text:#3D2C3A; --sub:#8A7480; --line:#F3DCE5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Prompt',-apple-system,sans-serif;
  background:linear-gradient(160deg,#FFD6E8 0%,#FFF0F5 45%,#FFE9D6 100%);
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:20px 16px;color:var(--text);
}

/* ---------- CARD ---------- */
.card{
  width:100%;max-width:400px;background:#fff;border-radius:26px;
  box-shadow:0 18px 50px rgba(201,24,74,.16);
  overflow:hidden;animation:pop .5s cubic-bezier(.2,.8,.3,1.2);
}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}

.card-head{
  background:linear-gradient(135deg,var(--pink),var(--deep));
  color:#fff;padding:26px 22px 22px;text-align:center;position:relative;
}
.card-head::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:18px;
  background:#fff;border-radius:20px 20px 0 0;
}
.cake{font-size:44px;line-height:1;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.kicker{font-size:11px;letter-spacing:3px;opacity:.9;margin-top:8px;font-weight:600}
.headline{font-size:22px;font-weight:700;margin-top:2px}
.count-badge{
  display:inline-block;margin-top:10px;padding:4px 14px;border-radius:999px;
  background:rgba(255,255,255,.22);font-size:12px;font-weight:600;
}

.card-body{padding:20px 20px 8px}

/* ---------- NAME LIST (จุดกันล้น) ---------- */
.name-wrap{position:relative}
.name-list{
  display:flex;flex-direction:column;gap:9px;
  max-height:38vh;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:2px 6px 2px 2px;
}
.name-list::-webkit-scrollbar{width:5px}
.name-list::-webkit-scrollbar-track{background:transparent}
.name-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.name-list{scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* fade ขอบล่างบอกว่ายังเลื่อนได้ */
.name-wrap.scrollable::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:34px;
  background:linear-gradient(transparent,#fff 85%);pointer-events:none;border-radius:0 0 14px 14px;
}

.name-item{
  display:flex;align-items:center;gap:11px;
  padding:11px 14px;border-radius:15px;
  background:var(--soft);border:1px solid var(--line);
  animation:slide .35s backwards;
}
@keyframes slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.name-item .no{
  flex:0 0 24px;height:24px;border-radius:50%;
  background:var(--pink);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.name-item .txt{flex:1;min-width:0}
.name-item .nick{
  font-size:16px;font-weight:600;color:var(--deep);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.name-item .full{
  font-size:11px;color:var(--sub);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ---- โหมดคนเดียว: โชว์ใหญ่กลางการ์ด ---- */
.name-list.is-single{gap:0;max-height:none;overflow:visible}
.name-list.is-single .name-item{
  flex-direction:column;text-align:center;gap:4px;padding:22px 16px;background:transparent;border:none;
}
.name-list.is-single .no{display:none}
.name-list.is-single .nick{font-size:30px;line-height:1.25;white-space:normal}
.name-list.is-single .full{font-size:13px;white-space:normal}

/* ---- 2 คอลัมน์เมื่อคนเยอะ ---- */
.name-list.is-many{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:44vh;
}
.name-list.is-many .name-item{padding:9px 10px;gap:8px}
.name-list.is-many .nick{font-size:13px}
.name-list.is-many .full{font-size:10px}
@media (max-width:340px){ .name-list.is-many{grid-template-columns:1fr} }

.wish{
  text-align:center;font-size:13px;color:var(--sub);
  line-height:1.75;padding:16px 6px 4px;
}
.date{
  text-align:center;font-size:11px;color:var(--sub);
  padding-bottom:14px;letter-spacing:.5px;
}

/* ---------- ACTIONS ---------- */
.actions{padding:4px 20px 22px;display:flex;flex-direction:column;gap:9px}
.btn{
  border:none;border-radius:14px;padding:14px;font-family:inherit;
  font-size:15px;font-weight:600;cursor:pointer;transition:transform .12s,opacity .2s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--deep));color:#fff;
  box-shadow:0 8px 20px rgba(201,24,74,.28)}
.btn-ghost{background:#fff;color:var(--sub);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;pointer-events:none}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
  background:rgba(61,44,58,.94);color:#fff;padding:11px 20px;border-radius:999px;
  font-size:13px;opacity:0;transition:.28s;pointer-events:none;z-index:99;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* confetti */
.confetti{position:fixed;top:-12px;width:9px;height:9px;opacity:.85;z-index:1;
  animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(680deg);opacity:0}}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="card-head">
    <div class="cake">🎂</div>
    <div class="kicker">HAPPY BIRTHDAY</div>
    <div class="headline">สุขสันต์วันเกิด</div>
    <div class="count-badge" id="countBadge" style="display:none"></div>
  </div>

  <div class="card-body">
    <div class="name-wrap" id="nameWrap">
      <div class="name-list" id="nameList"></div>
    </div>
    <div class="wish" id="wish"></div>
    <div class="date" id="dateText"></div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="shareBtn">💌 ส่งการ์ดนี้ให้เพื่อน</button>
    <button class="btn btn-ghost" id="closeBtn">ปิดหน้าต่าง</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== ⚠️ ใส่ LIFF ID ของคุณตรงนี้ ====== */
const LIFF_ID = '1234567890-abcdefgh';

/* ---------- อ่าน query (รองรับ liff.state) ---------- */
function getParams(){
  let qs = location.search;
  if (!qs || qs.indexOf('names') === -1){
    const st = new URLSearchParams(location.search).get('liff.state');
    if (st) qs = st.charAt(0) === '?' ? st : '?' + st;
  }
  return new URLSearchParams(qs || '');
}
const params = getParams();

const nicks = (params.get('names') || params.get('name') || 'เพื่อน')
                .split('|').map(s => s.trim()).filter(Boolean);
const fulls = (params.get('fulls') || params.get('full') || '')
                .split('|').map(s => s.trim()).filter(Boolean);

function joinNames(a){
  if (!a.length) return 'เพื่อน';
  if (a.length === 1) return a[0];
  if (a.length <= 3)  return a.slice(0,-1).join(', ') + ' และ ' + a[a.length-1];
  return a.slice(0,2).join(', ') + ' และอีก ' + (a.length-2) + ' ท่าน';
}
const displayName = joinNames(nicks);
const shareUrl    = location.href;

/* ---------- RENDER ---------- */
function render(){
  const list = document.getElementById('nameList');
  const wrap = document.getElementById('nameWrap');

  if (nicks.length === 1)      list.classList.add('is-single');
  else if (nicks.length >= 6)  list.classList.add('is-many');

  list.innerHTML = nicks.map(function(n,i){
    const full = fulls[i] && fulls[i] !== n ? fulls[i] : '';
    return '<div class="name-item" style="animation-delay:' + (i*0.05) + 's">'
         +   '<div class="no">' + (i+1) + '</div>'
         +   '<div class="txt">'
         +     '<div class="nick">' + esc(n) + '</div>'
         +     (full ? '<div class="full">' + esc(full) + '</div>' : '')
         +   '</div>'
         + '</div>';
  }).join('');

  if (nicks.length > 1){
    const b = document.getElementById('countBadge');
    b.textContent = '🎉 ' + nicks.length + ' ท่าน';
    b.style.display = 'inline-block';
  }

  document.getElementById('wish').innerHTML =
    nicks.length > 1
      ? 'ขอให้ทุกท่านมีความสุขมาก ๆ<br>สุขภาพแข็งแรง สมหวังทุกสิ่งที่ตั้งใจ ✨'
      : 'ขอให้มีความสุขมาก ๆ สุขภาพแข็งแรง<br>สมหวังทุกสิ่งที่ตั้งใจนะ ✨';

  document.getElementById('dateText').textContent =
    new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});

  // เช็กว่าล้นจนต้องเลื่อนไหม → โชว์ fade
  requestAnimationFrame(function(){
    if (list.scrollHeight > list.clientHeight + 4) wrap.classList.add('scrollable');
    list.addEventListener('scroll', function(){
      const atEnd = list.scrollTop + list.clientHeight >= list.scrollHeight - 6;
      wrap.classList.toggle('scrollable', !atEnd);
    });
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- FLEX ตอนแชร์ ---------- */
function buildShareFlex(){
  const rows = nicks.slice(0,8).map(function(n,i){
    return { type:'box', layout:'baseline', spacing:'sm', contents:[
      { type:'text', text:'🎈', size:'sm', flex:0 },
      { type:'text', text:(fulls[i] || n), size:'sm', color:'#3D2C3A', flex:1 }
    ]};
  });
  if (nicks.length > 8){
    rows.push({ type:'text', text:'…และอีก ' + (nicks.length-8) + ' ท่าน',
                size:'xs', color:'#8A7480', margin:'sm' });
  }

  return {
    type:'flex',
    altText:'🎂 สุขสันต์วันเกิด ' + displayName,
    contents:{
      type:'bubble', size:'mega',
      header:{ type:'box', layout:'vertical', backgroundColor:'#FF6B9D', paddingAll:'22px',
        contents:[
          { type:'text', text:'🎂 HAPPY BIRTHDAY', color:'#FFFFFF', size:'xs',
            weight:'bold', letterSpacing:'2px' },
          { type:'text', text:'สุขสันต์วันเกิด', color:'#FFFFFF', size:'xxl',
            weight:'bold', margin:'sm' },
          { type:'text', text:displayName, color:'#FFE3EC', size:'sm', margin:'xs', wrap:true }
        ]},
      body:{ type:'box', layout:'vertical', spacing:'sm',
        backgroundColor:'#FFF0F5', paddingAll:'18px', contents:rows },
      footer:{ type:'box', layout:'vertical', paddingAll:'14px', contents:[
        { type:'button', style:'primary', height:'sm', color:'#C9184A',
          action:{ type:'uri', label:'🎁 เปิดการ์ดอวยพร', uri:shareUrl } }
      ]}
    }
  };
}

/* ---------- LIFF ---------- */
const shareBtn = document.getElementById('shareBtn');

liff.init({ liffId: LIFF_ID })
  .then(function(){
    if (!liff.isApiAvailable('shareTargetPicker')){
      shareBtn.textContent = '📋 คัดลอกลิงก์การ์ด';
    }
  })
  .catch(function(e){
    console.error(e);
    shareBtn.textContent = '📋 คัดลอกลิงก์การ์ด';
  });

shareBtn.addEventListener('click', function(){
  shareBtn.disabled = true;

  const fallback = function(){
    navigator.clipboard.writeText(shareUrl)
      .then(function(){ toast('คัดลอกลิงก์แล้ว 📋'); })
      .catch(function(){ toast('คัดลอกไม่สำเร็จ'); })
      .then(function(){ shareBtn.disabled = false; });
  };

  if (typeof liff === 'undefined' || !liff.isApiAvailable || !liff.isApiAvailable('shareTargetPicker')){
    return fallback();
  }

  liff.shareTargetPicker([buildShareFlex()])
    .then(function(res){
      if (res) { toast('ส่งการ์ดเรียบร้อย 💌'); confetti(); }
      shareBtn.disabled = false;
    })
    .catch(function(err){ console.error(err); fallback(); });
});

document.getElementById('closeBtn').addEventListener('click', function(){
  if (typeof liff !== 'undefined' && liff.isInClient()) liff.closeWindow();
  else toast('ปิดแท็บนี้ได้เลยครับ');
});

/* ---------- UI helper ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

function confetti(){
  const colors = ['#FF6B9D','#C9184A','#FFD166','#8AC926','#4CC9F0'];
  for (let i = 0; i < 45; i++){
    const d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = Math.random()*100 + 'vw';
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    d.style.animationDelay = (Math.random()*0.5) + 's';
    if (i % 3 === 0) d.style.borderRadius = '50%';
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, 4500);
  }
}

render();
setTimeout(confetti, 350);
</script>
</body>
</html>
